<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>肥鱼的图库</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef5fa;color:#15354b;font:16px/1.6 'Microsoft YaHei',sans-serif}header{background:#194e71;color:white;padding:32px max(5vw,20px)}h1{font-size:34px;margin:0}header p{margin:8px 0 0;color:#cce7f5}main{max-width:1320px;margin:24px auto;padding:0 20px}form,.tools{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:16px 0}input,select,button{font:inherit;padding:9px 12px;border:1px solid #94b3c8;border-radius:6px;max-width:100%}button{background:#194e71;color:white;cursor:pointer}button.danger{background:#a33;margin-left:8px}button:disabled{opacity:.6}a{color:#21618b}header a{color:white}input:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid #d18a28;outline-offset:2px}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}article{background:white;border:1px solid #c2d8e7;padding:12px;border-radius:10px}article img{width:100%;height:210px;object-fit:contain;background:#e8eff3}article p{font-size:14px;overflow-wrap:anywhere}small{color:#536d80}#status{min-height:28px}label{display:flex;gap:6px;align-items:center}#tag{width:100%;margin-top:8px}article button{margin-top:8px}footer{margin:30px 0;color:#536d80}
</style><header><h1>肥鱼的图库</h1><p>收下群里的表情，也记住每张图适合说什么。 <a href="/">返回管理页</a></p></header>
<main><form id="access"><label>访问令牌 <input id="token" type="password" autocomplete="off" placeholder="本机未配置时可留空"></label><label>群号 <input id="group" type="number" min="1" required placeholder="输入要查看的群号"></label><button>打开图库</button></form>
<div class="tools"><label>来源 <select id="source"><option value="">全部</option><option value="group">群聊收藏</option><option value="search">搜索图片</option></select></label><label>筛选 <input id="filter" placeholder="描述或标签"></label><label>搜索图片 <input id="query" maxlength="150" placeholder="例如：橘猫"></label><button id="search">搜索并收藏</button></div>
<p id="vision"></p><p id="status" role="status">输入群号，查看本群收藏。GIF 会直接播放。可填写使用场景，帮助她配图；不想要的图可以删掉。</p><section id="grid" aria-label="图片收藏"></section><footer>非 @ 自动回复概率 15%；配图独立抽取 20%，优先按语境匹配，没匹配到随机发一张。</footer></main>
<script>
const el=id=>document.getElementById(id);let items=[];
const headers=()=>({'Authorization':'Bearer '+el('token').value,'Content-Type':'application/json'});
async function api(url,options={}){let r=await fetch(url,{...options,headers:headers()});if(!r.ok)throw Error('请求失败 '+r.status+'，请检查群号和访问令牌');return r.json()}
function render(){el('grid').replaceChildren();let filtered=items.filter(x=>(!el('source').value||x.source===el('source').value)&&JSON.stringify([x.description,x.tags,x.context]).includes(el('filter').value));for(let x of filtered){let card=document.createElement('article'),img=document.createElement('img');img.loading='lazy';img.alt=x.description||'尚未识别的收藏图片';img.src='/api/gallery/'+x.group_id+'/'+encodeURIComponent(x.name)+'?token='+encodeURIComponent(el('token').value);card.append(img);let label=document.createElement('small');label.textContent=(x.source==='search'?'搜索图片':'群聊收藏')+(x.animated?' · GIF 动图':'');card.append(label);let p=document.createElement('p');p.textContent=x.description||'尚无视觉描述，可在下方填写适合的场景。';card.append(p);if(x.origin&&/^https?:\/\//.test(x.origin)){let a=document.createElement('a');a.href=x.origin;a.target='_blank';a.rel='noreferrer';a.textContent='查看图片来源与授权';card.append(a)}let input=document.createElement('input');input.value=x.tags||'';input.maxLength=200;input.placeholder='使用场景，例如：开心 大笑 鼓励';input.setAttribute('aria-label','图片使用场景');input.style.width='100%';card.append(input);let save=document.createElement('button');save.textContent='保存场景';save.onclick=async()=>{try{await api('/api/gallery/'+x.group_id+'/'+encodeURIComponent(x.name)+'/tags',{method:'POST',body:JSON.stringify({tags:input.value})});x.tags=input.value;el('status').textContent='场景已保存，后续用于配图。'}catch(e){el('status').textContent=e.message}};card.append(save);let del=document.createElement('button');del.textContent='删除';del.className='danger';del.setAttribute('aria-label','从图库删除这张图片');del.onclick=async()=>{if(!confirm('从本群图库删除这张图？删除后无法恢复。'))return;del.disabled=true;try{await api('/api/gallery/'+x.group_id+'/'+encodeURIComponent(x.name),{method:'DELETE'});items=items.filter(y=>y.name!==x.name);render();el('status').textContent='已从图库删除。'}catch(e){del.disabled=false;el('status').textContent=e.message}};card.append(del);el('grid').append(card)}el('status').textContent=filtered.length?'共 '+filtered.length+' 张图片':'本群还没有匹配图片。可以发送图片到群里，或搜索并收藏。'}
async function load(){if(!el('group').value)return;let data=await api('/api/gallery?group_id='+encodeURIComponent(el('group').value));items=data.items;el('vision').textContent=data.vision_enabled?'视觉识别已启用：有人明确问图片内容时才识别；图库收藏表情包时会写短描述。':'视觉识别未配置：可以收藏、播放 GIF 和标注场景；按需识别需配置视觉模型。';render()}
el('access').onsubmit=async e=>{e.preventDefault();try{await load()}catch(e){el('status').textContent=e.message}};el('source').onchange=render;el('filter').oninput=render;
el('search').onclick=async()=>{if(!el('group').value||!el('query').value){el('status').textContent='请填写群号和搜索关键词。';return}el('search').disabled=true;el('status').textContent='正在搜索并收藏图片…';try{let data=await api('/api/gallery/search',{method:'POST',body:JSON.stringify({group_id:Number(el('group').value),query:el('query').value})});await load();el('status').textContent=data.result}catch(e){el('status').textContent=e.message}finally{el('search').disabled=false}};
</script></html>
